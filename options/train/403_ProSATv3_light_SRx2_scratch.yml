
# general settings
name: 403_ProSATv3_light_SRx2_scratch
model_type: PMDModel
scale: 2
num_gpu: 2
manual_seed: 0

find_unused_parameters: true

# dataset and data loader settings
# NOTE: ProSAT.md specifies DF2K; we train on DIV2K only so results stay
# directly comparable to the 30x PFT/ProMoD series (all DIV2K).
datasets:
  train:
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_HR
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16       # 2 GPU x batch 16 = effective 32 (ProSAT.md light recipe)
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/LRbicx2_matlab
    io_backend:
      type: disk

  val_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set14/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set14/LRbicx2_matlab
    io_backend:
      type: disk

  val_3:
    name: BSD100
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/B100/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/B100/LRbicx2_matlab
    io_backend:
      type: disk

  # Urban100 / Manga109 are DELIBERATELY ABSENT -- measured on node 3, both
  # ProSATv2 and ProSATv3 still OOM on a 40GB A100 at Urban100 x2 LR
  # (384x512) and even at 640x360. Removing the attention matrix via SDPA was
  # necessary but NOT sufficient: the remaining wall is dta_assign's own
  # quadratic intermediates -- sim_sub, mask_higher_density and
  # masked_sim_sub are each [B, S, S] with S = 4K = 0.12N (3.06GB apiece at
  # 640x360), plus sim_token_center at [B, N, K] (6.37GB). Amortizing the
  # assignment 4x does not shrink any single peak.
  #
  # Enabling these needs a chunked dta_assign (math-identical, memory-only)
  # or a smaller candidate pool -- tracked as follow-up work, NOT bundled
  # here so this experiment stays one attributable change. Adding them to
  # this config would kill the run at its first validation (iter 5000).

# network structures
network_g:
  type: ProSATv3
  upscale: 2
  in_chans: 3
  embed_dim: 60
  depths: [4, 4, 4, 4]
  num_heads: 6
  ffn_ratio: 2.0
  qkv_bias: true
  dta_m_ratio: 0.03
  dta_min_clusters: 16
  mod_warmup_layers: 2         # schedule: 2x1.0, 2x0.8, 4x0.6, 8x0.5 (avg r=0.625); active from iter 0
  img_range: 1.

  # --- v3: identical architecture/params to 402, cheaper execution ---
  dta_recluster_every: 4       # cluster once per residual group (=depth), reuse
                               # the assignment for the other 3 blocks; the merge
                               # still runs every block so K/V stay fresh.
                               # 1 == 402's behaviour (per-block reclustering).
  dta_deterministic: true      # removes the two RNG calls inside the assignment
                               # (randperm subsample + density tie-break jitter).
                               # 402 is measurably non-deterministic at inference
                               # (max|diff| 4.7e-04 between identical forwards);
                               # this is the one deliberate training-dynamics
                               # difference vs 402 -- flagged, not incidental.
  use_sdpa: true               # PSAA has no additive positional bias and v2
                               # already discards attn_map, so this is a
                               # math-identical drop-in (verified 4.5e-07).
  # 0.7744M params (unchanged vs 402 -- pure compute/memory change).
  # Verified via model.flops():
  #    64x64 : 4.022G -> 3.015G  (25.0% cut)
  #   640x360: 5828G  -> 2603G   (55.3% cut)
  # The cut grows with resolution because what is amortized are DTA's two
  # quadratic terms (S^2*C and the token-to-center similarity N*m*C).
  #
  # MEASURED on an A100 (node 3, batch 1, no_grad) -- wall-clock beats the
  # FLOPs ratio by a wide margin, because SDPA and the scatter_add merge cut
  # memory traffic, not just arithmetic:
  #     64x64  : 161.6ms -> 39.2ms   (4.13x)
  #    256x256 : 2319ms  -> 532ms    (4.36x)
  # Quality cost of stale assignments, measured by loading 402's own
  # net_g_345000 EMA weights into v3 with no retraining (Set5 PSNR):
  #    v2 (as trained) 38.0902 | r=1 38.0809 | r=2 38.0717 | r=4 38.0631
  # i.e. r=4 costs 0.027dB for a 4.36x speedup -- and that is a LOWER bound,
  # since 403 trains under r=4 natively rather than inheriting v2's weights.

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Muon                 # official torch.optim.Muon (needs SISR29 env, see set_MUON.md)
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]         # AdamW group (biases/norms/convs) only

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [500000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 500000
  warmup_iter: -1              # no lr warmup (ProSAT.md recipe)

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: yes
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: yes

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
