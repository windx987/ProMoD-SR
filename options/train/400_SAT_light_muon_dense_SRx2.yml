
# general settings
name: 400_SAT_light_muon_dense_SRx2
model_type: PMDModel
scale: 2
num_gpu: 2
manual_seed: 0

find_unused_parameters: true

# dataset and data loader settings
# NOTE: ProSAT.md specifies DF2K; we train on DIV2K only so results stay
# directly comparable to the 30x PFT/ProMoD series (all DIV2K).
datasets:
  train:
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_HR
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16       # 2 GPU x batch 16 = effective 32 (ProSAT.md light recipe)
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/LRbicx2_matlab
    io_backend:
      type: disk

  val_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set14/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set14/LRbicx2_matlab
    io_backend:
      type: disk

  val_3:
    name: BSD100
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/B100/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/B100/LRbicx2_matlab
    io_backend:
      type: disk

# network structures
network_g:
  type: ProSAT
  upscale: 2
  in_chans: 3
  embed_dim: 60
  depths: [4, 4, 4, 4]
  num_heads: 6
  ffn_ratio: 2.0
  qkv_bias: true
  dta_m_ratio: 0.03
  dta_min_clusters: 16
  mod_warmup_layers: 2
  mod_disable: true            # <- THE ONLY DIFFERENCE vs 401. All layers r=1.0.
  img_range: 1.
  # Dense SAT control. Differs from 401 by exactly one flag, so any quality gap
  # between 400 and 401/402/403 is attributable to MoD routing alone -- which is
  # currently unanswerable: 402 sits 0.24dB under dense PFT-light, and that gap
  # confounds "is our SAT port weaker than PFT at 0.77M on DIV2K" with "is MoD
  # hurting SAT". Only this run separates them.
  #
  # At r=1.0 routing is fully bypassed (active_idx=None), so GDFN takes its dense
  # path and the zero-fill corruption that stalled 401 at iter 50K cannot occur.
  # The `importance` running product is still computed each layer but is
  # .detach()ed and never consumed -- wasted work, cannot affect the output.
  #
  # 0.7736M params (identical to 401 -- routing adds no parameters in ProSAT,
  # its router is parameter-free). FLOPs: 4.82G @64x64, 6999.5G @640x360.
  # 401/402's routed schedule saves 16.6% of that.
  #
  # NOTE: unlike the PFT family, ProSAT's MoD saving is REAL -- DTA compresses
  # K/V to m~0.03N independently of routing, so routing forfeits nothing. In PFT
  # the key narrowing is produced BY the dense path that routing bypasses, which
  # is why 501/502/503 ended up above dense. MoD composes with SAT, not with PFA.

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Muon                 # official torch.optim.Muon (needs SISR29 env, see set_MUON.md)
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]         # AdamW group (biases/norms/convs) only

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [500000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 500000
  warmup_iter: -1              # no lr warmup (ProSAT.md recipe)

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: yes
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: yes

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
