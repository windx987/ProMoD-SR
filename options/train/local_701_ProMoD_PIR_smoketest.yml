
# Staged verification step 2 (per PIR plan): short smoke run on real HPC
# data/hardware before committing to the full 500K-iter 701 run. Checks:
#   (a) l_pix loss curve tracks 502's early trajectory closely (pfa_alpha
#       starts at zero contribution -- divergence from iter 1 means a
#       wiring bug, not "the mechanism working differently").
#   (b) pfa_alpha stats (logged via PMDPIRModel.get_gate_stats()) move off
#       zero (not dead) and don't blow up (not unstable) within 2000 iters.
#   (c) after this run, benchmark.py @640x360 against the smoke checkpoint
#       is the real gate -- if it doesn't show a wall-clock win over dense
#       PFT there, stop before spending 500K iterations (see plan).
# Validation is disabled -- this is a training-dynamics check only.

name: local_701_ProMoD_PIR_smoketest
model_type: PMDModel
scale: 2
num_gpu: 2
manual_seed: 0

find_unused_parameters: true

datasets:
  train:
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_HR
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/DIV2K/DIV2K_train_LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/GTmod12
    dataroot_lq: /mnt/pvc-shared-pvc-datasets-04a32ccd/Evaluation/Set5/LRbicx2_matlab
    io_backend:
      type: disk

network_g:
  type: PMDPIRModel
  upscale: 2
  in_chans: 3
  img_size: 64
  embed_dim: 52
  depths: [2, 4, 6, 6, 6]
  num_heads: 4
  num_topk: [256, 256,
              256, 256, 256, 256,
              256, 256, 256, 256, 256, 256,
              256, 256, 256, 256, 256, 256,
              256, 256, 256, 256, 256, 256]
  window_size: 32
  convffn_kernel_size: 7
  img_range: 1.
  mlp_ratio: 1
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
  use_checkpoint: false
  mod_warmup_layers: 2
  mod_capacity: 0.48

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Muon                 # same optimizer as the real 701 run -- this
    lr: !!float 5e-4           # smoke test must validate stability under
    weight_decay: 0            # the ACTUAL production settings, not a
    betas: [0.9, 0.99]         # simplified stand-in (AdamW etc).

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000, 490000]
    gamma: 0.5

  total_iter: 2000
  warmup_iter: 20000    # never reached at 2000 iters -- matches 701 exactly

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 1e6        # effectively disabled -- never reached
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: yes
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: yes

logger:
  print_freq: 10
  save_checkpoint_freq: !!float 5e2   # every 500 iters -- lets gate stats be
                                       # inspected offline from saved
                                       # checkpoints without touching the
                                       # shared train.py (in use by other
                                       # live runs on other nodes)
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
